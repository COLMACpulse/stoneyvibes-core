<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StoneyVibes — Sessions (V1)</title>

  <style>
    /* =========================
       STONEYVIBES V1 — CORE
       Single-file, no build step
       ========================= */

    :root {
      --bg: #0b0d10;
      --fg: #e9eef5;
      --muted: #9aa3ad;
      --line: rgba(255,255,255,0.12);
      --accent: #7fd1ae;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.45;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 16px 80px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin: 0 0 8px;
    }

    h2 {
      font-size: 0.9rem;
      font-weight: 600;
      margin: 28px 0 8px;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    p {
      margin: 0 0 12px;
      color: var(--muted);
    }

    .divider {
      height: 1px;
      background: var(--line);
      margin: 20px 0;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--line);
      padding: 10px 12px;
      font-size: 0.85rem;
      border-radius: 6px;
      cursor: pointer;
    }

    button.active {
      border-color: var(--accent);
      color: var(--accent);
    }

    button:focus {
      outline: none;
    }

    textarea {
      width: 100%;
      min-height: 80px;
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      font-size: 0.85rem;
      resize: vertical;
    }

    .small {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .session {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .log {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.75rem;
      color: var(--muted);
      white-space: pre-wrap;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(11,13,16,0.95);
      border-top: 1px solid var(--line);
      padding: 10px;
      text-align: center;
    }

    footer button {
      width: 90%;
      max-width: 320px;
    }
  </style>
</head>

<body>
  <main>
    <h1>StoneyVibes</h1>
    <p>Sessions exist. Press what applies. Or don’t.</p>

    <div class="divider"></div>

    <h2>Session</h2>

    <div class="session">

      <h2>Sampling</h2>
      <div class="row">
        <button data-field="source" data-value="stash">My stash</button>
        <button data-field="source" data-value="other">Something else</button>
      </div>

      <h2>Time</h2>
      <div class="row">
        <button data-field="time" data-value="morning">Morning</button>
        <button data-field="time" data-value="midday">Midday</button>
        <button data-field="time" data-value="evening">Evening</button>
        <button data-field="time" data-value="night">Night</button>
      </div>

      <h2>Intent</h2>
      <div class="row">
        <button data-field="intent" data-value="calm">Calm</button>
        <button data-field="intent" data-value="focus">Focus</button>
        <button data-field="intent" data-value="move">Move</button>
        <button data-field="intent" data-value="rest">Rest</button>
      </div>

      <h2>Body</h2>
      <div class="row">
        <button data-field="body" data-value="light">Light</button>
        <button data-field="body" data-value="heavy">Heavy</button>
        <button data-field="body" data-value="neutral">Neutral</button>
      </div>

      <h2>Notes</h2>
      <textarea id="notes" placeholder="Optional. Or not."></textarea>

    </div>

    <div class="divider"></div>

    <h2>Recent</h2>
    <div id="recent" class="log">No sessions yet.</div>

  </main>

  <footer>
    <button id="save">Save Session</button>
  </footer>

  <script>
    // =========================
    // STONEYVIBES V1 MEMORY
    // Local-only. No sync.
    // =========================

    const state = {};
    const buttons = document.querySelectorAll("button[data-field]");

    buttons.forEach(btn => {
      btn.addEventListener("click", () => {
        const field = btn.dataset.field;
        const value = btn.dataset.value;

        if (state[field] === value) {
          delete state[field];
          btn.classList.remove("active");
        } else {
          state[field] = value;
          buttons.forEach(b => {
            if (b.dataset.field === field) b.classList.remove("active");
          });
          btn.classList.add("active");
        }
      });
    });

    const saveBtn = document.getElementById("save");
    const recentEl = document.getElementById("recent");

    function loadSessions() {
      return JSON.parse(localStorage.getItem("sv_sessions") || "[]");
    }

    function saveSessions(sessions) {
      localStorage.setItem("sv_sessions", JSON.stringify(sessions));
    }

    function renderSessions() {
      const sessions = loadSessions();
      if (!sessions.length) {
        recentEl.textContent = "No sessions yet.";
        return;
      }
      recentEl.textContent = sessions
        .slice(-5)
        .reverse()
        .map(s => JSON.stringify(s, null, 2))
        .join("\n\n");
    }

    saveBtn.addEventListener("click", () => {
      const session = {
        ts: new Date().toISOString(),
        ...state,
        notes: document.getElementById("notes").value || null
      };
      const sessions = loadSessions();
      sessions.push(session);
      saveSessions(sessions);
      renderSessions();
    });

    renderSessions();
  </script>
</body>
</html>
