<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>StoneyVibes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="app">

    <section class="log-card">
      <h1>LOG</h1>
      <p class="sub">One tap. Timestamp. Done.</p>

      <div class="buttons-row">
        <button>AM</button>
        <button>NOON</button>
        <button>PM</button>
        <button>REST</button>
      </div>

      <p class="status">Ready.</p>
    </section>

    <!-- SESSION AUGMENT (UI ONLY) -->
    <section class="session-augment">

      <h2>Session</h2>

      <!-- PHOTO -->
      <div class="block">
        <label>Photo (optional)</label>
        <button class="ghost">Add Photo</button>
        <div class="photo-placeholder">No photo</div>
      </div>

      <!-- SEVERITY -->
      <div class="block">
        <label>Rate it</label>
        <input type="range" min="1" max="5" value="3" />
        <div class="range-labels">
          <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
        </div>
      </div>

      <!-- SMELL -->
      <div class="block">
        <label>Smell</label>
        <div class="tag-grid">
          <button>citrus</button>
          <button>gas</button>
          <button>sweet</button>
          <button>earthy</button>
          <button>pine</button>
          <button>funk</button>
          <button>floral</button>
          <button>sharp</button>
          <button>muted</button>
          <button>other</button>
        </div>

        <input
          type="text"
          placeholder="Anything else?"
          class="smell-note"
        />
      </div>

    </section>

    <footer class="footer">
      Baseline build · no extras
    </footer>

  </main>

</body>
</html>
