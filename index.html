<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StoneyVibes — Tier 1</title>
  <link rel="stylesheet" href="style.css" />
  <style>
  /* TIER 1 BG — hard-forced from HTML (bypasses CSS/path issues) */
  html, body { height: 100%; }
  body { background: #0b0b0b; }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: url("/stoneyvibes-core/assets/tier1_bg.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    opacity: 0.22;
    pointer-events: none;
    z-index: -1;
  }
</style>

</head>
<body>
  <main class="shell">
    <header class="top">
      <div class="brand">STONEYVIBES</div>
      <div class="tier">TIER 1</div>
    </header>

    <section class="card">
      <h1 class="title">LOG</h1>
      <p class="sub">One tap. Timestamp. Done.</p>

      <div class="grid">
        <button class="btn" data-tag="AM">AM</button>
        <button class="btn" data-tag="NOON">NOON</button>
        <button class="btn" data-tag="PM">PM</button>
        <button class="btn" data-tag="REST">REST</button>
      </div>

      <div class="status" id="status">Ready.</div>
    </section>

    <footer class="foot">
      <span class="tiny">Baseline build • no extras</span>
    </footer>
  </main>

  <script>
    // Tier-1: minimal behavior (no storage yet)
    const statusEl = document.getElementById("status");
    document.querySelectorAll(".btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const tag = btn.dataset.tag;
        const t = new Date().toLocaleString();
        statusEl.textContent = `${tag} logged @ ${t}`;
      });
    });
  </script>
</body>
</html>
